spring:
  datasource:
    url: jdbc:h2:file:${HIBERNATE_H2_FILE_PATH:./data/wordlearner}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}